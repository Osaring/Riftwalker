<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riftwalker">
<meta name="theme-color" content="#0b0712">
<title>Riftwalker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
  <canvas id="overlay"></canvas>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div id="stickZone"></div>
  <div id="camZone"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>

  <div id="topLeft">
    <div id="lvlBadge">1</div>
    <div class="bars">
      <div class="bar hp"><div class="fill"></div><span></span></div>
      <div class="bar rage"><div class="fill"></div><span></span></div>
    </div>
  </div>
  <div id="floorTag"></div>
  <div id="topRight">
    <canvas id="minimap" width="120" height="120"></canvas>
    <div class="col">
      <button id="pauseBtn" class="round" aria-label="Pause">❚❚</button>
      <button id="bagBtn" class="round" aria-label="Héros"><canvas class="ico" data-icon="i_bag"></canvas><i id="bagDot"></i></button>
    </div>
  </div>
  <div id="loot"></div>
  <div id="xpBar"><div class="fill"></div></div>

  <div id="actions">
    <button class="act big" data-act="attack" id="btnAttack"><canvas class="ico" data-icon="i_attack"></canvas></button>
    <button class="act" data-act="skill1" id="btnSkill1"><canvas class="ico" data-icon="i_charge"></canvas><b class="cd"></b><i class="cost"></i><i class="lock"></i></button>
    <button class="act" data-act="skill2" id="btnSkill2"><canvas class="ico" data-icon="i_mortal"></canvas><b class="cd"></b><i class="cost"></i><i class="lock"></i></button>
    <button class="act" data-act="skill3" id="btnSkill3"><canvas class="ico" data-icon="i_leap"></canvas><b class="cd"></b><i class="cost"></i><i class="lock"></i></button>
    <button class="act ult" data-act="ult" id="btnUlt"><canvas class="ico" data-icon="i_avatar"></canvas><b class="cd"></b><i class="lock"></i></button>
    <button class="act small" data-act="parry" id="btnParry"><canvas class="ico" data-icon="i_parry"></canvas><b class="cd"></b><i class="lock"></i></button>
    <button class="act small" data-act="roll" id="btnRoll"><canvas class="ico" data-icon="i_roll"></canvas><b class="cd"></b></button>
    <button class="act small" data-act="potion" id="btnPotion"><canvas class="ico" data-icon="i_potion"></canvas><b class="cd"></b><i class="count">3</i></button>
    <div id="aimCancel">✕</div>
  </div>
</div>

<!-- ===== ÉCRANS ===== -->
<div id="loading" class="screen show">
  <div class="logo">RIFTWALKER</div>
  <div class="loadbar"><div id="loadFill"></div></div>
  <p id="loadText">Chargement…</p>
</div>

<div id="title" class="screen">
  <div class="logo big">RIFTWALKER</div>
  <p class="tagline">Les failles s'ouvrent sous la crypte. Descends.</p>
  <div class="menu">
    <button id="playBtn" class="primary">Jouer</button>
    <button id="heroBtnTitle">Héros</button>
    <div class="row"><button id="soundBtn" class="ghost">Sons : oui</button><button id="musicBtn" class="ghost">Musique : oui</button></div>
  </div>
  <p id="titleStats" class="stats"></p>
  <p class="credit">Modèles 3D : Quaternius & Kay Lousberg (CC0) · Icônes : game-icons.net (CC BY 3.0) · <span id="versionLabel"></span></p>
</div>

<div id="hero" class="screen">
  <div class="heroTop">
    <div class="tabs"><button data-tab="gear" class="on">Équipement</button><button data-tab="skills">Compétences <i id="ptsDot"></i></button><button data-tab="shop">Marchand</button></div>
    <div class="money"><canvas class="ico" data-icon="i_coin"></canvas><b id="goldText">0</b></div>
    <button id="heroClose" class="round">✕</button>
  </div>
  <div class="tab show" id="tab-gear">
    <div class="paper">
      <div class="slots left" id="slotsL"></div>
      <div class="preview"><div id="statsBox"></div></div>
      <div class="slots right" id="slotsR"></div>
    </div>
    <div class="bagWrap"><h3>Sac <small id="bagCount"></small></h3><div id="bag"></div></div>
  </div>
  <div class="tab" id="tab-skills"><p class="hint" id="ptsText"></p><div id="skillList"></div></div>
  <div class="tab" id="tab-shop"><div id="shopList"></div><h3>Vendre</h3><p class="hint">Touche un objet de ton sac pour le vendre.</p><div id="sellBag"></div></div>
  <div id="tooltip" class="hidden"></div>
  <div class="heroBottom"><button id="enterBtn" class="primary">Entrer dans le donjon</button></div>
</div>

<div id="pause" class="screen">
  <h2>Pause</h2>
  <div class="menu">
    <button id="resumeBtn" class="primary">Reprendre</button>
    <button id="heroBtnPause">Héros</button>
    <button id="quitBtn" class="ghost">Retour au menu</button>
  </div>
</div>

<div id="death" class="screen">
  <h2 class="red">Vaincu…</h2>
  <p id="deathText"></p>
  <div class="menu"><button id="retryBtn" class="primary">Revenir au début de l'étage</button><button id="deathHero">Héros</button></div>
</div>

<div id="banner"></div>
<div id="updateBar" class="hidden"><span><b>Nouvelle version</b> du jeu disponible</span><button id="updateBtn">Mettre à jour</button></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
